<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Password Card – Version stable</title>

<style>
  :root {
    /* Taille écran (pixels) */
    --card-width-screen: 360px;
    --card-height-screen: 230px;

    /* Taille impression (mm) */
    --card-width-print: 85.6mm;
    --card-height-print: 54mm;

    --card-radius: 10px;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --border: #d0d0dd;
    --text: #222;
    --accent: #3b82f6;
    --accent-soft: #e0edff;
    --grid-border: #e2e2ee;
    --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #eef1f7;
    font-family: var(--font-main);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 0.03em;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #555;
    text-align: center;
    max-width: 520px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .toolbar input {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    min-width: 220px;
  }

  .toolbar button {
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .toolbar button.secondary {
    background: #e5e7eb;
    color: #111;
  }

  .card-wrapper {
    background: var(--bg);
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  /* ÉCRAN : taille en pixels */
  .password-card {
    width: var(--card-width-screen);
    height: var(--card-height-screen);
    background: var(--card-bg);
    border-radius: var(--card-radius);
    border: 1px solid var(--border);
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    margin-bottom: 4px;
  }

  .card-title {
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .card-tag {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 9px;
  }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-auto-rows: 14px;
    border: 1px solid var(--grid-border);
    border-radius: 6px;
    overflow: hidden;
    background: #fafafa;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;
    position: relative;
  }

  .cell-label {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 6px;
    color: #999;
  }

  .cell-color-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 4px;
    height: 4px;
    border-radius: 999px;
  }

  .color-a .cell-color-dot { background: #f97316; }
  .color-b .cell-color-dot { background: #22c55e; }
  .color-c .cell-color-dot { background: #3b82f6; }
  .color-d .cell-color-dot { background: #a855f7; }

  .card-footer {
    margin-top: 4px;
    font-size: 9px;
    display: flex;
    justify-content: space-between;
  }

  /* IMPRESSION : vraie taille carte bancaire */
  @media print {
    body { background: #fff; padding: 0; }
    h1, .subtitle, .toolbar { display: none; }

    .card-wrapper {
      box-shadow: none;
      padding: 0;
      margin: 0;
    }

    .password-card {
      width: var(--card-width-print);
      height: var(--card-height-print);
      padding: 6mm;
      border-radius: 4mm;
    }
  }
</style>
</head>

<body>

<h1>Password Card</h1>
<div class="subtitle">
  Carte de mots de passe imprimable. Choisis une règle (couleur + position) et transforme ton mot de passe mémorisable en mot de passe robuste.
</div>

<div class="toolbar">
  <input id="seedInput" type="text" placeholder="Seed (ex: change me 😄)">
  <button id="generateBtn">🔁 Régénérer</button>
  <button id="printBtn" class="secondary">🖨️ Imprimer</button>
</div>

<div class="card-wrapper">
  <div class="password-card">
    <div class="card-header">
      <div class="card-title">PASSWORD CARD</div>
      <div class="card-tag">offline • personal</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="card-footer">
      <div id="seedInfo"></div>
      <div>PASSCARD v1.0</div>
    </div>
  </div>
</div>

<script>
  const defaultSeed = "change me 😄";
  const outputSet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789,.;:!?-*%/&'\"#()";

  const gridEl = document.getElementById("grid");
  const seedInfoEl = document.getElementById("seedInfo");
  const seedInputEl = document.getElementById("seedInput");

  function pseudoRandom(seed) {
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return () => ((h ^= h << 13, h ^= h >>> 17, h ^= h << 5) >>> 0) / 4294967295;
  }

  function generateCard(seed) {
    const prng = pseudoRandom(seed);
    gridEl.innerHTML = "";

    const rows = 10, cols = 16;
    const colors = ["color-a", "color-b", "color-c", "color-d"];

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("div");
        cell.className = "cell " + colors[Math.floor(prng() * colors.length)];

        const label = document.createElement("span");
        label.className = "cell-label";
        label.textContent = String.fromCharCode(65 + r) + (c + 1);

        const dot = document.createElement("span");
        dot.className = "cell-color-dot";

        const char = document.createElement("span");
        char.textContent = outputSet[Math.floor(prng() * outputSet.length)];

        cell.append(label, dot, char);
        gridEl.appendChild(cell);
      }
    }

    seedInfoEl.textContent = `seed="${seed}"`;
  }

  document.getElementById("generateBtn").onclick = () => {
    const seed = seedInputEl.value.trim() || defaultSeed;
    generateCard(seed);
  };

  document.getElementById("printBtn").onclick = () => window.print();

  seedInputEl.value = defaultSeed;
  generateCard(defaultSeed);
</script>

</body>
</html>
